apiVersion: v1
kind: Service
metadata:
  name: jlpt-helper-service
  labels:
    app: jlpt-helper
spec:
  type: NodePort  # 같은 네트워크 내 외부 접근용
  selector:
    app: jlpt-helper
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
    nodePort: 30080  # 선택사항: 특정 포트 지정 (30000-32767 범위)
