apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlpt-helper
  labels:
    app: jlpt-helper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jlpt-helper
  template:
    metadata:
      labels:
        app: jlpt-helper
    spec:
      containers:
      - name: jlpt-helper
        # AWS ECR 이미지 경로로 변경 필요
        # 형식: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/jlpt-helper:latest
        image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/jlpt-helper:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
